[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[project]
name = "carpet-scan"
version = "0.1.0"
description = "Carpet diagnostics: aggregates pyan3, vulture, radon, grimp and ruff into module-level quality tables and a Markdown/HTML report."
readme = "README.md"
# 3.12 is the floor because PEP 695 `type` aliases are the newest syntax used here.
# Kept as low as the code allows: this tool has to install into the environment of
# whatever project it scans, and a high floor makes it unusable there (Prozor is 3.12).
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Witold Wolski", email = "wew@fgcz.ethz.ch" },
]
dependencies = [
    # Aggregated tools. pyan3/vulture/radon/ruff are invoked as subprocesses and must be on
    # PATH; grimp/networkx/pydot are imported.
    "pyan3>=2.2",
    "vulture>=2.14",
    "radon>=6",
    "ruff>=0.15",
    "grimp>=3",
    "networkx>=3",
    "pydot>=3",
    # CLI and output, per the workspace rule: cyclopts for parameters, loguru for logging.
    "cyclopts>=3",
    "loguru>=0.7",
    "rich>=13",
    # Markdown -> HTML for the optional browser rendering. Already present via rich; declared
    # directly because carpet_scan imports it.
    "markdown-it-py>=3",
]

[project.scripts]
carpet-scan = "carpet_scan.cli:app"

[dependency-groups]
dev = [
    "build>=1.3,<2",
    "deptry>=0.24,<1",
    "pre-commit>=4,<5",
    "pyright>=1.1.400,<2",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.15,<1",
    "twine>=6,<7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "PGH",
    "PIE",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportImportCycles = "error"
# grimp, networkx and pydot ship no stubs. Keep strict first-party checking and suppress
# only the diagnostics whose sole signal is a propagated Unknown from those libraries.
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnnecessaryTypeIgnoreComment = "error"
reportImplicitOverride = "error"
enableTypeIgnoreComments = false

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["carpet_scan"]

[tool.coverage.report]
fail_under = 45
show_missing = true
skip_covered = true

[tool.deptry]
known_first_party = ["carpet_scan"]

[tool.deptry.per_rule_ignores]
# Real dependencies, invoked as subprocesses rather than imported, so deptry cannot see the use.
# They must be installed: the scan shells out to them by name on PATH.
DEP002 = ["pyan3", "vulture", "radon", "ruff"]
